<section class="mob-top-spc">
    <div class="container mt-4">
        <div class="col-sm-12 text-center mb-2 pt-2 pb-2">
            <h2 class="text-uppercase">{{'our_products' | translate}}</h2> <span class="cus-tit-bor"></span>
        </div>
    </div>
</section>
<section class="cus-home-qequest">
    <div class="container pt-0 mt-5">
    <div class="row" >
        <div class="product-grid">
            <div class="product-card" *ngFor="let product of productList">
                <mat-card>
                    <mat-card-header>
                        <mat-card-title>{{ product.title }}</mat-card-title>
                    </mat-card-header>
                    <img mat-card-image src="{{product_img_url}}{{product.image}}" alt="{{ product.title }}">
                    <mat-card-content>
                        <p>{{ product.description }}</p>
                    </mat-card-content>
                </mat-card>
            </div>
        </div>
    </div>
    </div>

</section>
